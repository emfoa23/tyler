# 주간 당첨결과·배출점 동기화.
# 스케줄은 이 레포가 아니라 cron-job.org 가 GitHub API workflow_dispatch 로 트리거한다
# (토 20:50/21:05/21:30/23:05/23:30 + 일 10:00 KST, 멱등 재시도).
# `on: schedule` 을 두지 않는 이유: 60일 무커밋 시 GitHub 이 스케줄 워크플로를
# 자동 비활성화하는 정책 때문 — 외부 dispatch 는 이 정책의 영향을 받지 않는다.
name: sync-draw

on:
  workflow_dispatch:

concurrency:
  group: sync-draw
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync draw results, winning stores, and check generated sets
        run: node scripts/sync-draw.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
          SITE_URL: https://lottogen.click
