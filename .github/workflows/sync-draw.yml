# 주간 당첨결과·배출점 동기화.
# 스케줄은 이 레포가 아니라 cron-job.org 가 GitHub API workflow_dispatch 로 트리거한다
# (토 20:40~21:05 5분 간격 + 22:00/23:00 백스톱 + 일 10:00 KST, 멱등 재시도. 일요일 실행은 추첨 후
# 12시간이 지났으므로 최근 3회차 배출점을 재대조한다 — scripts/sync-draw.mjs).
# `on: schedule` 을 두지 않는 이유: 60일 무커밋 시 GitHub 이 스케줄 워크플로를
# 자동 비활성화하는 정책 때문 — 외부 dispatch 는 이 정책의 영향을 받지 않는다.
name: sync-draw

on:
  workflow_dispatch:

concurrency:
  group: sync-draw
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # 슬롯당 동행복권 호출 1~2회·콜당 재시도 예산 ~75초 → 정상 1분 안쪽. 6분을 넘기면 스로틀이니 다음 슬롯에 맡긴다.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync draw results, winning stores, and check generated sets
        run: node scripts/sync-draw.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
          SITE_URL: https://lottogen.click
